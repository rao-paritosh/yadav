<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glass Neon Ludo</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="bg"></div>
<div class="ambient ambient-red"></div>
<div class="ambient ambient-green"></div>
<div class="ambient ambient-blue"></div>

<div class="menu-screen" id="menuScreen">
  <div class="menu-card glass">
    <h1>GLASS LUDO</h1>
    <p>Premium Neon Edition</p>

    <div class="menu-buttons">
      <button onclick="startGame(2)">2 PLAYERS</button>
      <button onclick="startGame(4)">4 PLAYERS</button>
    </div>
  </div>
</div>

<div class="top-ui">

  <div class="turn-box glass">
    <div class="turn-label">TURN</div>
    <div class="turn-color" id="turnColor"></div>
    <div class="turn-name" id="turnName">RED</div>
  </div>

  <div class="control-box glass">
    <button id="diceBtn">ROLL DICE</button>
    <button onclick="restartGame()">RESTART</button>
  </div>

</div>

<div class="game-wrapper">

  <div class="board glass" id="board">

    <div class="center-triangle"></div>

  </div>

</div>

<div class="dice-wrapper glass">

  <div class="dice" id="dice">
    <div class="face front">⚀</div>
  </div>

  <div class="dice-value" id="diceValue">1</div>

</div>

<div class="winner-screen hidden" id="winnerScreen">
  <div class="winner-card glass">
    <h1 id="winnerText">RED WINS!</h1>
    <button onclick="restartGame()">PLAY AGAIN</button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
