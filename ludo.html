<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Ludo UI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at top,#1b0030,#020617 70%);
overflow:hidden;
}

.board{

width:92vmin;
height:92vmin;

display:grid;
grid-template-columns:repeat(15,1fr);
grid-template-rows:repeat(15,1fr);

padding:10px;
gap:2px;

border-radius:35px;

background:
rgba(255,255,255,.05);

backdrop-filter:blur(25px);

border:
2px solid rgba(255,255,255,.15);

box-shadow:
0 0 60px rgba(255,255,255,.08),
inset 0 0 20px rgba(255,255,255,.08);

position:relative;

}

.cell{

border-radius:12px;

background:
rgba(255,255,255,.07);

border:
1px solid rgba(255,255,255,.08);

display:flex;
justify-content:center;
align-items:center;

position:relative;

overflow:hidden;

}

.red-zone{
background:
rgba(255,0,0,.15);
}

.green-zone{
background:
rgba(0,255,100,.12);
}

.blue-zone{
background:
rgba(0,120,255,.12);
}

.yellow-zone{
background:
rgba(255,220,0,.12);
}

.red-path{
background:
linear-gradient(
180deg,
rgba(255,0,0,.55),
rgba(255,0,0,.18)
);
}

.green-path{
background:
linear-gradient(
180deg,
rgba(0,255,100,.45),
rgba(0,255,100,.15)
);
}

.blue-path{
background:
linear-gradient(
180deg,
rgba(0,120,255,.45),
rgba(0,120,255,.15)
);
}

.yellow-path{
background:
linear-gradient(
180deg,
rgba(255,220,0,.45),
rgba(255,220,0,.15)
);
}

.center{
background:
conic-gradient(
red,
yellow,
blue,
green,
red
);
}

.home{

width:78%;
height:78%;

border-radius:28px;

display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;

gap:20px;

padding:20px;

box-shadow:
inset 0 0 25px rgba(255,255,255,.08),
0 0 30px rgba(255,255,255,.15);

}

.red-home{
background:
linear-gradient(
145deg,
#ff0033,
#4b0000
);
}

.green-home{
background:
linear-gradient(
145deg,
#00ff6a,
#003d19
);
}

.blue-home{
background:
linear-gradient(
145deg,
#0077ff,
#001f5c
);
}

.yellow-home{
background:
linear-gradient(
145deg,
#ffd000,
#5c4800
);
}

.token{

width:100%;
height:100%;

border-radius:50%;

position:relative;

box-shadow:
inset 0 0 12px rgba(255,255,255,.5),
0 0 25px rgba(255,255,255,.35);

}

.token::before{

content:"";

position:absolute;

top:10%;
left:15%;

width:40%;
height:40%;

border-radius:50%;

background:
rgba(255,255,255,.8);

filter:blur(2px);

}

.red{
background:
radial-gradient(circle at top,#ffb3b3,#ff0033 60%);
}

.green{
background:
radial-gradient(circle at top,#b6ffcb,#00d95f 60%);
}

.blue{
background:
radial-gradient(circle at top,#b6dbff,#0077ff 60%);
}

.yellow{
background:
radial-gradient(circle at top,#fff5b6,#ffd000 60%);
}

.star{
font-size:26px;
color:white;
opacity:.8;
text-shadow:0 0 10px white;
}

.arrow{
font-size:28px;
font-weight:bold;
opacity:.5;
}

.controls{

position:absolute;
bottom:-110px;

left:50%;
transform:translateX(-50%);

display:flex;
align-items:center;
gap:30px;

}

.btn{

width:170px;
height:70px;

border-radius:22px;

display:flex;
justify-content:center;
align-items:center;

font-size:28px;
font-weight:bold;

background:
linear-gradient(
145deg,
#ff0033,
#420000
);

color:white;

box-shadow:
0 0 25px rgba(255,0,0,.35);

border:
1px solid rgba(255,255,255,.1);

}

.dice{

width:90px;
height:90px;

border-radius:25px;

background:
rgba(255,255,255,.08);

display:flex;
justify-content:center;
align-items:center;

font-size:50px;

backdrop-filter:blur(10px);

border:
1px solid rgba(255,255,255,.15);

box-shadow:
0 0 30px rgba(255,255,255,.08);

}

</style>
</head>

<body>

<div class="board" id="board"></div>

<script>

const board=document.getElementById("board");

for(let row=0;row<15;row++){

for(let col=0;col<15;col++){

const cell=document.createElement("div");

cell.classList.add("cell");

if(row<6 && col<6)
cell.classList.add("red-zone");

else if(row<6 && col>8)
cell.classList.add("green-zone");

else if(row>8 && col<6)
cell.classList.add("blue-zone");

else if(row>8 && col>8)
cell.classList.add("yellow-zone");

if(row>=6 && row<=8)
cell.classList.add("path");

if(col>=6 && col<=8)
cell.classList.add("path");

if(row>=6 && row<=8 && col>=6 && col<=8)
cell.classList.add("center");

board.appendChild(cell);

}

}

const cells=document.querySelectorAll(".cell");

function createHome(start,colorClass,homeClass){

const home=document.createElement("div");

home.classList.add("home");
home.classList.add(homeClass);

for(let i=0;i<4;i++){

const token=document.createElement("div");

token.classList.add("token");
token.classList.add(colorClass);

home.appendChild(token);

}

cells[start].appendChild(home);

}

createHome(0,"red","red-home");
createHome(14,"green","green-home");
createHome(210,"blue","blue-home");
createHome(224,"yellow","yellow-home");

const centerIndex=112;

cells[centerIndex].classList.add("center");

const stars=[7,34,70,104,154,188,220,190];

stars.forEach(i=>{

const s=document.createElement("div");

s.classList.add("star");

s.innerHTML="★";

cells[i].appendChild(s);

});

const arrows=[
{index:52,text:"⇧"},
{index:82,text:"⇦"},
{index:142,text:"⇩"},
{index:172,text:"⇨"}
];

arrows.forEach(a=>{

const el=document.createElement("div");

el.classList.add("arrow");

el.innerHTML=a.text;

cells[a.index].appendChild(el);

});

const controls=document.createElement("div");

controls.classList.add("controls");

controls.innerHTML=`

<div class="btn">
PLAYER
</div>

<div class="dice">
🎲
</div>

<div class="btn">
ROLL
</div>

`;

board.appendChild(controls);

</script>

</body>
</html>
