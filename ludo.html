<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlassArcade Premium Ludo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#0f172a,#7c3aed,#06b6d4,#111827);
background-size:400% 400%;
animation:bg 15s ease infinite;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
}

.title{
font-size:42px;
font-weight:bold;
text-shadow:0 0 25px rgba(255,255,255,.6);
}

.glass{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
backdrop-filter:blur(20px);
box-shadow:0 8px 32px rgba(0,0,0,.35);
border-radius:24px;
}

.board{
width:90vmin;
height:90vmin;
max-width:700px;
max-height:700px;
display:grid;
grid-template-columns:repeat(15,1fr);
grid-template-rows:repeat(15,1fr);
padding:8px;
gap:1px;
}

.cell{
background:rgba(255,255,255,.05);
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.red-zone{background:#ff174433;}
.green-zone{background:#00e67633;}
.yellow-zone{background:#ffd60033;}
.blue-zone{background:#00b0ff33;}

.path{
background:rgba(255,255,255,.08);
}

.safe{
background:#22c55e66;
}

.center{
background:linear-gradient(45deg,#ff1744,#ffd600,#00e676,#00b0ff);
}

.token{
width:70%;
height:70%;
border-radius:50%;
position:absolute;
cursor:pointer;
transition:.25s;
border:2px solid rgba(255,255,255,.7);
box-shadow:
0 0 15px rgba(255,255,255,.5),
0 0 30px rgba(255,255,255,.2);
animation:float 2s ease infinite;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-4px);}
100%{transform:translateY(0);}
}

.red{background:#ff1744;}
.green{background:#00e676;}
.yellow{background:#ffd600;}
.blue{background:#00b0ff;}

.controls{
padding:20px 30px;
display:flex;
gap:25px;
align-items:center;
}

.dice{
width:90px;
height:90px;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
font-weight:bold;
}

.roll{
animation:roll .7s ease;
}

@keyframes roll{
0%{transform:rotate(0) scale(1);}
50%{transform:rotate(180deg) scale(1.25);}
100%{transform:rotate(360deg) scale(1);}
}

button{
padding:15px 30px;
border:none;
border-radius:16px;
background:linear-gradient(45deg,#7c3aed,#06b6d4);
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.turn{
font-size:20px;
font-weight:bold;
}

@media(max-width:700px){

.controls{
flex-direction:column;
}

.title{
font-size:30px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="title">
🎮 GlassArcade Ludo
</div>

<div class="board glass" id="board"></div>

<div class="controls glass">

<div class="dice glass" id="dice">
1
</div>

<button onclick="rollDice()">
Roll Dice
</button>

<div class="turn" id="turn">
Turn: RED
</div>

</div>

</div>

<script>

const board=document.getElementById("board");

for(let i=0;i<225;i++){

const cell=document.createElement("div");
cell.classList.add("cell");

const row=Math.floor(i/15);
const col=i%15;

if(row<6 && col<6) cell.classList.add("red-zone");
else if(row<6 && col>8) cell.classList.add("green-zone");
else if(row>8 && col<6) cell.classList.add("blue-zone");
else if(row>8 && col>8) cell.classList.add("yellow-zone");
else cell.classList.add("path");

if(
(row>=6 && row<=8) ||
(col>=6 && col<=8)
){
cell.classList.add("path");
}

if(row>=6 && row<=8 && col>=6 && col<=8){
cell.classList.add("center");
}

board.appendChild(cell);

}

const cells=document.querySelectorAll(".cell");

const path=[
6,7,8,23,38,53,68,83,
84,85,86,87,88,73,58,
43,28,13,14,15,30,45,
60,75,90,105,106,107,
108,109,110,125,140,155,
170,185,200,201,202,187,
172,157,142,127,126,141,
156,171,186,203,204,205,
190,175,160,145,130,115,
114,113,112,111,96,81,
66,51,36,21
];

const players=[
{
name:"RED",
color:"red",
position:0
},
{
name:"GREEN",
color:"green",
position:0
},
{
name:"YELLOW",
color:"yellow",
position:0
},
{
name:"BLUE",
color:"blue",
position:0
}
];

let currentPlayer=0;

players.forEach((p,index)=>{

const token=document.createElement("div");

token.classList.add("token");
token.classList.add(p.color);

token.id="token"+index;

cells[path[0]].appendChild(token);

});

function playSound(freq){

const ctx=new(window.AudioContext||window.webkitAudioContext)();

const osc=ctx.createOscillator();

osc.type="sine";
osc.frequency.value=freq;

osc.connect(ctx.destination);

osc.start();

setTimeout(()=>{
osc.stop();
},100);

}

function rollDice(){

const dice=document.getElementById("dice");

dice.classList.remove("roll");

void dice.offsetWidth;

dice.classList.add("roll");

playSound(500);

const value=Math.floor(Math.random()*6)+1;

dice.innerHTML=value;

movePlayer(value);

}

function movePlayer(steps){

const player=players[currentPlayer];

let target=player.position+steps;

if(target>=path.length){

target=path.length-1;

setTimeout(()=>{
playSound(900);
alert(player.name+" WINS!");
},200);

}

animateMove(player,player.position,target);

player.position=target;

setTimeout(()=>{
nextTurn();
},steps*250);

}

function animateMove(player,start,end){

const token=document.getElementById(
"token"+players.indexOf(player)
);

let current=start;

const interval=setInterval(()=>{

if(current>end){

clearInterval(interval);
return;

}

cells[path[current]].appendChild(token);

playSound(300+current*5);

current++;

},220);

}

function nextTurn(){

currentPlayer++;

if(currentPlayer>=players.length){
currentPlayer=0;
}

document.getElementById("turn").innerHTML=
"Turn: "+players[currentPlayer].name;

}

</script>

</body>
</html>
