<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Glass Ludo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top,#180022,#020617 70%);

overflow:hidden;

}

.board{

width:92vmin;
height:92vmin;

display:grid;
grid-template-columns:repeat(15,1fr);
grid-template-rows:repeat(15,1fr);

padding:12px;
gap:2px;

border-radius:40px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.10),
rgba(255,255,255,.03)
);

backdrop-filter:blur(25px);

border:
1px solid rgba(255,255,255,.15);

box-shadow:
0 0 50px rgba(255,255,255,.05),
0 0 150px rgba(0,0,0,.7),
inset 0 0 25px rgba(255,255,255,.05);

position:relative;

}

.cell{

border-radius:14px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(255,255,255,.03)
);

border:
1px solid rgba(255,255,255,.08);

position:relative;

overflow:hidden;

}

.cell::before{

content:"";

position:absolute;
inset:0;

background:
linear-gradient(
145deg,
rgba(255,255,255,.18),
transparent 50%
);

pointer-events:none;

}

.red-area{
background:
linear-gradient(
145deg,
rgba(255,0,50,.28),
rgba(90,0,0,.2)
);
}

.green-area{
background:
linear-gradient(
145deg,
rgba(0,255,120,.25),
rgba(0,60,20,.2)
);
}

.blue-area{
background:
linear-gradient(
145deg,
rgba(0,120,255,.25),
rgba(0,20,60,.2)
);
}

.yellow-area{
background:
linear-gradient(
145deg,
rgba(255,210,0,.28),
rgba(70,50,0,.2)
);
}

.center{

background:
conic-gradient(
red,
yellow,
blue,
green,
red
);

}

.home{

width:78%;
height:78%;

position:absolute;

top:50%;
left:50%;

transform:translate(-50%,-50%);

border-radius:28px;

display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;

gap:18px;

padding:18px;

backdrop-filter:blur(15px);

box-shadow:
inset 0 0 20px rgba(255,255,255,.06),
0 0 30px rgba(255,255,255,.08);

}

.red-home{
background:
linear-gradient(
145deg,
#ff003c,
#4b0000
);
}

.green-home{
background:
linear-gradient(
145deg,
#00ff73,
#00361a
);
}

.blue-home{
background:
linear-gradient(
145deg,
#0084ff,
#001f4f
);
}

.yellow-home{
background:
linear-gradient(
145deg,
#ffd000,
#5f4900
);
}

.token{

border-radius:50%;

position:relative;

box-shadow:
inset 0 5px 10px rgba(255,255,255,.55),
inset 0 -8px 10px rgba(0,0,0,.45),
0 8px 15px rgba(0,0,0,.45),
0 0 18px rgba(255,255,255,.25);

}

.token::before{

content:"";

position:absolute;

top:8%;
left:18%;

width:38%;
height:38%;

border-radius:50%;

background:
rgba(255,255,255,.85);

filter:blur(2px);

}

.red{
background:
radial-gradient(circle at top,#ffccd7,#ff003c 65%);
}

.green{
background:
radial-gradient(circle at top,#c4ffd8,#00d45e 65%);
}

.blue{
background:
radial-gradient(circle at top,#d1e6ff,#0077ff 65%);
}

.yellow{
background:
radial-gradient(circle at top,#fff7ba,#ffd000 65%);
}

.path-red{
background:
linear-gradient(
180deg,
rgba(255,0,50,.55),
rgba(255,0,50,.15)
);
}

.path-green{
background:
linear-gradient(
180deg,
rgba(0,255,120,.55),
rgba(0,255,120,.15)
);
}

.path-blue{
background:
linear-gradient(
180deg,
rgba(0,120,255,.55),
rgba(0,120,255,.15)
);
}

.path-yellow{
background:
linear-gradient(
180deg,
rgba(255,210,0,.55),
rgba(255,210,0,.15)
);
}

.star{

position:absolute;

font-size:22px;

color:white;

text-shadow:
0 0 10px white,
0 0 20px white;

opacity:.9;

}

.controls{

position:absolute;

bottom:-120px;
left:50%;

transform:translateX(-50%);

display:flex;
align-items:center;
gap:28px;

}

.button{

width:180px;
height:70px;

border-radius:24px;

display:flex;
justify-content:center;
align-items:center;

font-size:28px;
font-weight:bold;

color:white;

background:
linear-gradient(
145deg,
#ff003c,
#420000
);

box-shadow:
0 0 25px rgba(255,0,50,.35);

border:
1px solid rgba(255,255,255,.12);

}

.dice{

width:90px;
height:90px;

border-radius:24px;

display:flex;
justify-content:center;
align-items:center;

font-size:52px;

background:
linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(255,255,255,.04)
);

backdrop-filter:blur(12px);

border:
1px solid rgba(255,255,255,.15);

box-shadow:
0 0 30px rgba(255,255,255,.06);

}

</style>
</head>

<body>

<div class="board" id="board"></div>

<script>

const board=document.getElementById("board");

for(let r=0;r<15;r++){

for(let c=0;c<15;c++){

const cell=document.createElement("div");

cell.classList.add("cell");

if(r<6 && c<6)
cell.classList.add("red-area");

else if(r<6 && c>8)
cell.classList.add("green-area");

else if(r>8 && c<6)
cell.classList.add("blue-area");

else if(r>8 && c>8)
cell.classList.add("yellow-area");

if(r>=6 && r<=8)
cell.classList.add("path");

if(c>=6 && c<=8)
cell.classList.add("path");

if(r>=6 && r<=8 && c>=6 && c<=8)
cell.classList.add("center");

board.appendChild(cell);

}

}

const cells=document.querySelectorAll(".cell");

function addHome(index,colorClass,homeClass){

const home=document.createElement("div");

home.classList.add("home");
home.classList.add(homeClass);

for(let i=0;i<4;i++){

const token=document.createElement("div");

token.classList.add("token");
token.classList.add(colorClass);

home.appendChild(token);

}

cells[index].appendChild(home);

}

addHome(0,"red","red-home");
addHome(14,"green","green-home");
addHome(210,"blue","blue-home");
addHome(224,"yellow","yellow-home");

const stars=[7,34,70,104,154,188,220];

stars.forEach(i=>{

const s=document.createElement("div");

s.classList.add("star");

s.innerHTML="★";

cells[i].appendChild(s);

});

const controls=document.createElement("div");

controls.classList.add("controls");

controls.innerHTML=`

<div class="button">
PLAYER
</div>

<div class="dice">
🎲
</div>

<div class="button">
ROLL
</div>

`;

board.appendChild(controls);

</script>

</body>
</html>
