<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Royale Ludo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top,#2b0000,#050505 70%);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

body::before{
content:"";
position:absolute;
width:150%;
height:150%;
background:
linear-gradient(
45deg,
rgba(255,0,0,.05),
rgba(255,255,255,.02),
rgba(0,0,0,.2)
);
animation:bgMove 12s linear infinite;
}

@keyframes bgMove{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

.container{
position:relative;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
}

.title{
font-size:42px;
font-weight:bold;
letter-spacing:2px;
text-shadow:0 0 20px rgba(255,0,0,.5);
}

.board{
width:90vmin;
height:90vmin;
max-width:760px;
max-height:760px;
display:grid;
grid-template-columns:repeat(15,1fr);
grid-template-rows:repeat(15,1fr);
background:rgba(255,255,255,.04);
backdrop-filter:blur(15px);
padding:8px;
border-radius:30px;
border:1px solid rgba(255,255,255,.08);
box-shadow:
0 0 40px rgba(255,0,0,.15),
0 0 100px rgba(0,0,0,.8);
}

.cell{
border:1px solid rgba(255,255,255,.03);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.red-base{
background:#420000;
}

.green-base{
background:#052b11;
}

.yellow-base{
background:#3d3200;
}

.blue-base{
background:#001f38;
}

.path{
background:rgba(255,255,255,.04);
}

.home-red{
background:#ff2b2b;
}

.home-green{
background:#00c853;
}

.home-yellow{
background:#ffd600;
}

.home-blue{
background:#0091ea;
}

.center{
background:
conic-gradient(
red,
yellow,
green,
blue,
red
);
}

.token{
width:68%;
height:68%;
border-radius:50%;
position:absolute;
cursor:pointer;
transition:.2s;
border:2px solid rgba(255,255,255,.8);
box-shadow:
0 0 10px rgba(255,255,255,.2),
inset 0 0 8px rgba(255,255,255,.2);
animation:float 2s ease infinite;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-3px);}
100%{transform:translateY(0px);}
}

.red{background:#ff1744;}
.green{background:#00e676;}
.yellow{background:#ffd600;}
.blue{background:#00b0ff;}

.controls{
display:flex;
align-items:center;
gap:25px;
padding:18px 28px;
border-radius:25px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.08);
}

button{
padding:15px 28px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#450000,#8b0000);
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

button:hover{
transform:scale(1.06);
}

.dice{
width:90px;
height:90px;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
font-weight:bold;
background:rgba(255,255,255,.05);
border-radius:20px;
border:1px solid rgba(255,255,255,.08);
}

.roll{
animation:roll .7s ease;
}

@keyframes roll{
0%{transform:rotate(0deg);}
50%{transform:rotate(180deg) scale(1.2);}
100%{transform:rotate(360deg);}
}

.turn{
font-size:18px;
font-weight:bold;
letter-spacing:1px;
}

.safe{
box-shadow:inset 0 0 20px rgba(255,255,255,.15);
}

@media(max-width:700px){

.controls{
flex-direction:column;
}

.title{
font-size:28px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="title">
DARK ROYALE LUDO
</div>

<div class="board" id="board"></div>

<div class="controls">

<div class="dice" id="dice">
1
</div>

<button onclick="rollDice()">
ROLL DICE
</button>

<div class="turn" id="turn">
TURN : RED
</div>

</div>

</div>

<script>

const board=document.getElementById("board");

for(let row=0;row<15;row++){

for(let col=0;col<15;col++){

const cell=document.createElement("div");

cell.classList.add("cell");

if(row<6 && col<6){
cell.classList.add("red-base");
}

else if(row<6 && col>8){
cell.classList.add("green-base");
}

else if(row>8 && col<6){
cell.classList.add("blue-base");
}

else if(row>8 && col>8){
cell.classList.add("yellow-base");
}

else{
cell.classList.add("path");
}

if(
(row>=6 && row<=8) &&
(col>=6 && col<=8)
){
cell.classList.add("center");
}

board.appendChild(cell);

}

}

const cells=document.querySelectorAll(".cell");

const path=[
6,7,8,23,38,53,68,83,
84,85,86,87,88,73,58,
43,28,13,14,15,30,45,
60,75,90,105,106,107,
108,109,110,125,140,
155,170,185,200,201,
202,187,172,157,142,
127,126,141,156,171,
186,203,204,205,190,
175,160,145,130,115,
114,113,112,111,96,
81,66,51,36,21
];

const players=[
{
name:"RED",
color:"red",
tokens:[0,0,0,0]
},
{
name:"GREEN",
color:"green",
tokens:[0,0,0,0]
},
{
name:"YELLOW",
color:"yellow",
tokens:[0,0,0,0]
},
{
name:"BLUE",
color:"blue",
tokens:[0,0,0,0]
}
];

let currentPlayer=0;
let currentDice=1;
let selectedToken=0;

function createTokens(){

players.forEach((player,pIndex)=>{

player.tokens.forEach((t,tIndex)=>{

const token=document.createElement("div");

token.classList.add("token");
token.classList.add(player.color);

token.id=`p${pIndex}t${tIndex}`;

token.onclick=()=>moveToken(pIndex,tIndex);

placeToken(pIndex,tIndex,0);

});

});

}

function placeToken(playerIndex,tokenIndex,pos){

const token=document.getElementById(
`p${playerIndex}t${tokenIndex}`
);

cells[path[pos]].appendChild(token);

}

createTokens();

function play(freq){

const ctx=new(window.AudioContext||window.webkitAudioContext)();

const osc=ctx.createOscillator();

osc.frequency.value=freq;

osc.connect(ctx.destination);

osc.start();

setTimeout(()=>{
osc.stop();
},80);

}

function rollDice(){

const dice=document.getElementById("dice");

dice.classList.remove("roll");

void dice.offsetWidth;

dice.classList.add("roll");

currentDice=Math.floor(Math.random()*6)+1;

dice.innerHTML=currentDice;

play(400);

}

function moveToken(playerIndex,tokenIndex){

if(playerIndex!==currentPlayer) return;

let player=players[playerIndex];

let currentPos=player.tokens[tokenIndex];

let newPos=currentPos+currentDice;

if(newPos>=path.length){

newPos=path.length-1;

}

animateToken(
playerIndex,
tokenIndex,
currentPos,
newPos
);

player.tokens[tokenIndex]=newPos;

setTimeout(()=>{

checkWin(playerIndex);

if(currentDice!==6){
nextTurn();
}

},currentDice*220);

}

function animateToken(playerIndex,tokenIndex,start,end){

const token=document.getElementById(
`p${playerIndex}t${tokenIndex}`
);

let step=start;

const interval=setInterval(()=>{

if(step>end){

clearInterval(interval);

return;

}

cells[path[step]].appendChild(token);

play(250+step*2);

step++;

},200);

}

function nextTurn(){

currentPlayer++;

if(currentPlayer>=players.length){
currentPlayer=0;
}

document.getElementById("turn").innerHTML=
"TURN : "+players[currentPlayer].name;

}

function checkWin(playerIndex){

const won=players[playerIndex]
.tokens.every(t=>t>=path.length-1);

if(won){

setTimeout(()=>{

alert(players[playerIndex].name+" WINS!");

},200);

}

}

</script>

</body>
</html>
