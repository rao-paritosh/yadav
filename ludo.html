<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlassArcade Ludo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#0f172a,#7c3aed,#06b6d4,#111827);
background-size:400% 400%;
animation:bg 15s ease infinite;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
display:flex;
flex-direction:column;
align-items:center;
gap:20px;
}

.glass{
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
backdrop-filter:blur(20px);
box-shadow:0 8px 32px rgba(0,0,0,0.3);
border-radius:25px;
}

.board{
width:600px;
height:600px;
display:grid;
grid-template-columns:repeat(15,1fr);
grid-template-rows:repeat(15,1fr);
overflow:hidden;
padding:5px;
}

.cell{
border:1px solid rgba(255,255,255,0.08);
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
position:relative;
}

.red-home{background:#ff4d6d;}
.green-home{background:#80ed99;}
.blue-home{background:#4cc9f0;}
.yellow-home{background:#ffd60a;color:black;}

.path{
background:rgba(255,255,255,0.08);
}

.safe{
background:#22c55e;
}

.token{
width:24px;
height:24px;
border-radius:50%;
position:absolute;
transition:.3s;
cursor:pointer;
box-shadow:0 0 15px rgba(255,255,255,0.7);
animation:float 2s ease infinite;
}

@keyframes float{
0%{transform:translateY(0px);}
50%{transform:translateY(-3px);}
100%{transform:translateY(0px);}
}

.red{background:#ff1744;}
.green{background:#00e676;}
.blue{background:#00b0ff;}
.yellow{background:#ffd600;}

.controls{
padding:20px;
display:flex;
gap:20px;
align-items:center;
}

button{
padding:14px 25px;
border:none;
border-radius:14px;
font-size:16px;
cursor:pointer;
background:linear-gradient(45deg,#7c3aed,#06b6d4);
color:white;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

.dice{
width:80px;
height:80px;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
font-weight:bold;
animation:none;
}

.roll{
animation:roll .6s ease;
}

@keyframes roll{
0%{transform:rotate(0deg) scale(1);}
50%{transform:rotate(180deg) scale(1.3);}
100%{transform:rotate(360deg) scale(1);}
}

.turn{
font-size:20px;
font-weight:bold;
}

.title{
font-size:40px;
margin-bottom:10px;
text-shadow:0 0 20px rgba(255,255,255,0.6);
}

@media(max-width:700px){

.board{
width:95vw;
height:95vw;
}

.token{
width:16px;
height:16px;
}

}

</style>
</head>

<body>

<div class="container">

<h1 class="title">🎮 GlassArcade Ludo</h1>

<div class="board glass" id="board"></div>

<div class="controls glass">

<div class="dice glass" id="dice">1</div>

<button onclick="rollDice()">Roll Dice</button>

<div class="turn" id="turnText">
Turn: RED
</div>

</div>

</div>

<script>

const board=document.getElementById("board");

for(let i=0;i<225;i++){

const cell=document.createElement("div");
cell.classList.add("cell");

if(i<36) cell.classList.add("red-home");
else if(i<72) cell.classList.add("green-home");
else if(i<108) cell.classList.add("yellow-home");
else if(i<144) cell.classList.add("blue-home");
else cell.classList.add("path");

board.appendChild(cell);

}

const cells=document.querySelectorAll(".cell");

const path=[
112,111,110,109,108,
93,78,63,48,33,18,3,
4,5,20,35,50,65,80,
95,96,97,98,99,100,
115,130,145,160,175,
190,205,206,207,192,
177,162,147,132,117,
118,119,120,121,122,
137,152,167,182,197,
212,211,210,195,180,
165,150,135
];

const players=[
{
name:"RED",
color:"red",
position:0
},
{
name:"GREEN",
color:"green",
position:0
},
{
name:"BLUE",
color:"blue",
position:0
},
{
name:"YELLOW",
color:"yellow",
position:0
}
];

let currentPlayer=0;

players.forEach((p,index)=>{

const token=document.createElement("div");

token.classList.add("token");
token.classList.add(p.color);

token.id="token"+index;

cells[path[0]].appendChild(token);

});

function rollDice(){

const dice=document.getElementById("dice");

dice.classList.remove("roll");

void dice.offsetWidth;

dice.classList.add("roll");

const value=Math.floor(Math.random()*6)+1;

dice.innerHTML=value;

movePlayer(value);

}

function movePlayer(steps){

const player=players[currentPlayer];

player.position+=steps;

if(player.position>=path.length){

player.position=path.length-1;

setTimeout(()=>{
alert(player.name+" Wins!");
},200);

}

const token=document.getElementById("token"+currentPlayer);

cells[path[player.position]].appendChild(token);

nextTurn();

}

function nextTurn(){

currentPlayer++;

if(currentPlayer>=players.length){
currentPlayer=0;
}

document.getElementById("turnText").innerHTML=
"Turn: "+players[currentPlayer].name;

}

</script>

</body>
</html>
