<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Neon Ludo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top left,#1f2f5f,#050816 60%);
    color:white;
}

/* BACKGROUND GLOW */

.bg-glow{
    position:fixed;
    border-radius:50%;
    filter:blur(120px);
    opacity:.3;
    z-index:-1;
}

.glow1{
    width:350px;
    height:350px;
    background:#ff0000;
    top:-100px;
    left:-100px;
}

.glow2{
    width:350px;
    height:350px;
    background:#00ff88;
    top:-50px;
    right:-100px;
}

.glow3{
    width:400px;
    height:400px;
    background:#0066ff;
    bottom:-150px;
    left:35%;
}

/* GLASS */

.glass{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:
    inset 0 0 12px rgba(255,255,255,.08),
    0 0 30px rgba(0,0,0,.4);
}

/* TOP UI */

.top-ui{
    width:100%;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.turn-box,
.controls,
.dice-box{
    padding:15px 20px;
    border-radius:20px;
}

.turn-box{
    display:flex;
    align-items:center;
    gap:15px;
}

.turn-dot{
    width:32px;
    height:32px;
    border-radius:50%;
    box-shadow:0 0 20px currentColor;
}

.controls{
    display:flex;
    gap:10px;
}

button{
    border:none;
    outline:none;
    padding:12px 18px;
    border-radius:14px;
    background:rgba(255,255,255,.1);
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:.25s;
    border:1px solid rgba(255,255,255,.1);
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px rgba(255,255,255,.15);
}

/* BOARD */

.game-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:5px;
}

.board{
    width:min(92vw,92vh);
    height:min(92vw,92vh);

    border-radius:35px;

    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);

    gap:2px;
    padding:10px;

    position:relative;

    overflow:hidden;
}

.cell{
    border-radius:10px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.08);
}

/* PATHS */

.red-path{
    background:rgba(255,0,0,.35);
    box-shadow:0 0 10px rgba(255,0,0,.4);
}

.green-path{
    background:rgba(0,255,100,.35);
    box-shadow:0 0 10px rgba(0,255,100,.4);
}

.blue-path{
    background:rgba(0,100,255,.35);
    box-shadow:0 0 10px rgba(0,100,255,.4);
}

.yellow-path{
    background:rgba(255,200,0,.35);
    box-shadow:0 0 10px rgba(255,200,0,.4);
}

/* HOMES */

.home{
    border-radius:28px;
    position:relative;
}

.red-home{
    background:rgba(255,0,0,.12);
    box-shadow:0 0 25px rgba(255,0,0,.35) inset;
}

.green-home{
    background:rgba(0,255,120,.12);
    box-shadow:0 0 25px rgba(0,255,120,.35) inset;
}

.blue-home{
    background:rgba(0,100,255,.12);
    box-shadow:0 0 25px rgba(0,100,255,.35) inset;
}

.yellow-home{
    background:rgba(255,210,0,.12);
    box-shadow:0 0 25px rgba(255,210,0,.35) inset;
}

/* CENTER */

.center{
    grid-column:7/10;
    grid-row:7/10;

    background:
    conic-gradient(
        red 0deg 90deg,
        #00ff88 90deg 180deg,
        #ffd000 180deg 270deg,
        #0066ff 270deg 360deg
    );

    clip-path:polygon(50% 0%,100% 50%,50% 100%,0 50%);

    border-radius:18px;

    z-index:5;

    box-shadow:0 0 25px rgba(255,255,255,.3);
}

/* PAWNS */

.pawn{
    width:70%;
    height:70%;

    border-radius:50%;

    position:absolute;

    cursor:pointer;

    transition:.25s;

    border:2px solid rgba(255,255,255,.7);

    z-index:20;

    box-shadow:
    inset -5px -5px 10px rgba(0,0,0,.35),
    inset 5px 5px 10px rgba(255,255,255,.25),
    0 0 15px currentColor;
}

.pawn:hover{
    transform:translateY(-3px) scale(1.05);
}

.redPawn{
    background:radial-gradient(circle at top,#ff9d9d,#ff0000);
    color:#ff0000;
}

.greenPawn{
    background:radial-gradient(circle at top,#b8ffd6,#00ff66);
    color:#00ff66;
}

.bluePawn{
    background:radial-gradient(circle at top,#bdd7ff,#0066ff);
    color:#0066ff;
}

.yellowPawn{
    background:radial-gradient(circle at top,#fff1a0,#ffc400);
    color:#ffc400;
}

.activePawn{
    animation:pulse .8s infinite;
}

@keyframes pulse{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.15); }
    100%{ transform:scale(1); }
}

/* DICE */

.dice-box{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    text-align:center;
}

.dice{
    font-size:55px;
}

.roll{
    animation:roll .7s linear;
}

@keyframes roll{
    from{ transform:rotate(0); }
    to{ transform:rotate(360deg); }
}

/* START SCREEN */

.start-screen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:100;
}

.start-card{
    width:400px;
    max-width:90%;
    padding:40px;
    border-radius:30px;
    text-align:center;
}

.start-card h1{
    font-size:55px;
    margin-bottom:10px;
}

.mode-buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
}

.hidden{
    display:none;
}

/* MOBILE */

@media(max-width:768px){

    .top-ui{
        flex-direction:column;
    }

    .controls{
        flex-wrap:wrap;
        justify-content:center;
    }

    .board{
        width:96vw;
        height:96vw;
    }

}

</style>
</head>

<body>

<div class="bg-glow glow1"></div>
<div class="bg-glow glow2"></div>
<div class="bg-glow glow3"></div>

<!-- START SCREEN -->

<div class="start-screen" id="startScreen">

    <div class="start-card glass">

        <h1>GLASS LUDO</h1>

        <p>Premium Neon Edition</p>

        <div class="mode-buttons">
            <button onclick="startGame(2)">2 PLAYER</button>
            <button onclick="startGame(4)">4 PLAYER</button>
        </div>

    </div>

</div>

<!-- TOP UI -->

<div class="top-ui">

    <div class="turn-box glass">

        <span>TURN</span>

        <div class="turn-dot" id="turnDot"></div>

    </div>

    <div class="controls glass">

        <button id="rollBtn">ROLL DICE</button>

        <button onclick="restartGame()">RESTART</button>

    </div>

</div>

<!-- BOARD -->

<div class="game-wrapper">

    <div class="board glass" id="board"></div>

</div>

<!-- DICE -->

<div class="dice-box glass">

    <div class="dice" id="dice">🎲</div>

    <div id="diceValue">1</div>

</div>

<script>

const board = document.getElementById("board");

const dice = document.getElementById("dice");

const diceValue = document.getElementById("diceValue");

const rollBtn = document.getElementById("rollBtn");

const turnDot = document.getElementById("turnDot");

const COLORS = ["red","green","yellow","blue"];

const COLOR_CODES = {

    red:"#ff0000",
    green:"#00ff88",
    yellow:"#ffd000",
    blue:"#0066ff"

};

let currentPlayer = 0;

let currentDice = 1;

let playersCount = 4;

const pawns = [];

/* START GAME */

function startGame(players){

    playersCount = players;

    document.getElementById("startScreen").classList.add("hidden");

    createBoard();

    updateTurn();

}

/* CREATE BOARD */

function createBoard(){

    board.innerHTML = "";

    for(let r=0;r<15;r++){

        for(let c=0;c<15;c++){

            const cell = document.createElement("div");

            cell.classList.add("cell");

            /* COLORED PATHS */

            if(r===7 && c<6){
                cell.classList.add("green-path");
            }

            if(c===7 && r<6){
                cell.classList.add("red-path");
            }

            if(r===7 && c>8){
                cell.classList.add("yellow-path");
            }

            if(c===7 && r>8){
                cell.classList.add("blue-path");
            }

            board.appendChild(cell);

        }

    }

    createHomes();

    const center = document.createElement("div");

    center.className = "center";

    board.appendChild(center);

}

/* HOMES */

function createHomes(){

    addHome("red",1,1);

    addHome("green",1,10);

    addHome("blue",10,1);

    addHome("yellow",10,10);

}

/* ADD HOME */

function addHome(color,row,col){

    const home = document.createElement("div");

    home.className = `home ${color}-home`;

    home.style.gridColumn = `${col}/span 5`;

    home.style.gridRow = `${row}/span 5`;

    board.appendChild(home);

    for(let i=0;i<4;i++){

        const pawn = document.createElement("div");

        pawn.className = `pawn ${color}Pawn`;

        pawn.dataset.color = color;

        pawn.dataset.index = i;

        pawn.dataset.step = -1;

        setHomePosition(pawn,color,i);

        pawn.onclick = ()=>pawnClick(pawn);

        board.appendChild(pawn);

        pawns.push(pawn);

    }

}

/* HOME POSITIONS */

function setHomePosition(pawn,color,index){

    const homes = {

        red:[
            [2,2],[4,2],[2,4],[4,4]
        ],

        green:[
            [11,2],[13,2],[11,4],[13,4]
        ],

        blue:[
            [2,11],[4,11],[2,13],[4,13]
        ],

        yellow:[
            [11,11],[13,11],[11,13],[13,13]
        ]

    };

    const pos = homes[color][index];

    pawn.style.gridColumn = pos[0];

    pawn.style.gridRow = pos[1];

}

/* CLICK */

function pawnClick(pawn){

    if(COLORS[currentPlayer] !== pawn.dataset.color){
        return;
    }

    movePawn(pawn,currentDice);

}

/* MOVE */

function movePawn(pawn,steps){

    let current = parseInt(pawn.dataset.step);

    if(current === -1 && steps !== 6){
        return;
    }

    if(current === -1){
        current = 0;
    }
    else{
        current += steps;
    }

    pawn.dataset.step = current;

    animatePawn(pawn);

    setTimeout(()=>{

        nextTurn();

    },500);

}

/* ANIMATION */

function animatePawn(pawn){

    pawn.classList.add("activePawn");

    setTimeout(()=>{

        pawn.classList.remove("activePawn");

    },700);

}

/* DICE */

function rollDice(){

    rollBtn.disabled = true;

    dice.classList.add("roll");

    setTimeout(()=>{

        currentDice = Math.floor(Math.random()*6)+1;

        diceValue.innerText = currentDice;

        dice.classList.remove("roll");

        rollBtn.disabled = false;

    },700);

}

rollBtn.onclick = rollDice;

/* TURN */

function nextTurn(){

    if(currentDice !== 6){

        currentPlayer++;

        if(currentPlayer >= playersCount){

            currentPlayer = 0;

        }

    }

    updateTurn();

}

/* TURN UI */

function updateTurn(){

    const color = COLORS[currentPlayer];

    turnDot.style.background = COLOR_CODES[color];

    turnDot.style.color = COLOR_CODES[color];

}

/* RESTART */

function restartGame(){

    location.reload();

}

</script>

</body>
</html>
