
<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>memory.html</title>
<link rel='stylesheet' href='../style.css'>
</head>
<body>
<div class='game glass'>
<a href='../index.html'>⬅ Home</a>

<h2>Memory Match</h2>
<div id='game'></div>
<script>
const emojis=['🍎','🍎','🎮','🎮','🚀','🚀','🔥','🔥'];
emojis.sort(()=>Math.random()-0.5);
let first=null;
const game=document.getElementById('game');
game.style.display='grid';
game.style.gridTemplateColumns='repeat(4,80px)';
emojis.forEach((e)=>{
let btn=document.createElement('button');
btn.innerHTML='?';
btn.style.height='80px';
btn.onclick=()=>{
btn.innerHTML=e;
if(!first) first={btn,e};
else{
if(first.e!==e){
setTimeout(()=>{
btn.innerHTML='?';
first.btn.innerHTML='?';
first=null;
},500);
}else first=null;
}
};
game.appendChild(btn);
});
</script>

</div>
</body>
</html>
